version: '3.8'

services:
  db:
    image: postgres:15
    container_name: odoo-db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  odoo:
    image: odoo:17
    container_name: odoo
    depends_on:
      - db
    ports:
      - "8069:8069"   # HTTP
      - "8072:8072"   # Gevent / WebSocket
    volumes:
      - ./config/odoo.conf:/etc/odoo/odoo.conf     # NO :ro
      - ./custom_addons:/mnt/custom-addons
      - ./extra-addons:/mnt/extra-addons
      - ./filestore:/var/lib/odoo/filestore
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    restart: always

volumes:
  db_data:
